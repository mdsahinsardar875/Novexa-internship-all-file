<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Daily Task List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="masthead">
    <div class="masthead-top">
      <span class="issue-label">DAILY EDITION</span>
      <span class="issue-date" id="todayDate"></span>
    </div>
    <h1 class="title">The Ledger</h1>
    <p class="subtitle">A running account of what needs doing</p>
    <div class="rule"></div>
  </header>

  <section class="entry-panel">
    <form id="taskForm" class="entry-form" autocomplete="off">
      <input
        type="text"
        id="taskInput"
        class="entry-input"
        placeholder="Enter a new item…"
        maxlength="140"
        required
      />
      <select id="taskPriority" class="entry-priority" aria-label="Priority">
        <option value="routine">Routine</option>
        <option value="important">Important</option>
        <option value="urgent">Urgent</option>
      </select>
      <button type="submit" class="entry-submit">File Entry</button>
    </form>
  </section>

  <section class="ledger-body">
    <div class="ledger-controls">
      <div class="tabs" role="tablist" id="filterTabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="open">Open</button>
        <button class="tab" data-filter="done">Settled</button>
      </div>
      <div class="tally" id="tally">0 open · 0 settled</div>
    </div>

    <ol id="taskList" class="task-list"></ol>

    <div id="emptyState" class="empty-state">
      <p class="empty-title">The ledger is blank.</p>
      <p class="empty-copy">Add your first entry above to open today's page.</p>
    </div>
  </section>

  <footer class="colophon">
    <span>Entries are kept in this browser only, via Local Storage.</span>
    <button id="clearDone" class="link-btn">Clear settled entries</button>
  </footer>

</div>

<!-- Edit dialog -->
<div id="editDialog" class="dialog-overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle">
    <h2 id="editDialogTitle">Revise Entry</h2>
    <form id="editForm">
      <input type="text" id="editInput" class="entry-input" maxlength="140" required />
      <select id="editPriority" class="entry-priority" aria-label="Priority">
        <option value="routine">Routine</option>
        <option value="important">Important</option>
        <option value="urgent">Urgent</option>
      </select>
      <div class="dialog-actions">
        <button type="button" id="cancelEdit" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-solid">Save Revision</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
